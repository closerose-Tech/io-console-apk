name: Build Android APK

on:
  workflow_dispatch:      # 手动触发: 仓库 Actions 页点击 Run workflow
  push:
    tags:
      - 'v*'              # 推送 v* 标签时自动构建

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 命令行工具
        uses: android-actions/setup-android@v3

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 构建 APK (debug 签名, 可直接安装)
        run: gradle -p android-apk assembleDebug --no-daemon

      - name: 整理产物
        run: |
          cp android-apk/app/build/outputs/apk/debug/app-debug.apk \
             "研华IO卡检测控制台_v2.2.0_debug.apk"
          ls -lh "研华IO卡检测控制台_v2.2.0_debug.apk"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: io-console-apk
          path: 研华IO卡检测控制台_v2.2.0_debug.apk
          retention-days: 90
