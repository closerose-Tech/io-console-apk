name: Build Android APK

on:
  workflow_dispatch:      # 手动触发: 仓库 Actions 页点击 Run workflow
  push:
    tags:
      - 'v*'              # 推送 v* 标签时自动构建
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy 17 要求 buildPython 与 APP 内置 Python 大小版本一致(3.13)
      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 手动安装 Android cmdline-tools (比 action 更可控, 失败可重试)
      - name: 安装 Android SDK
        run: |
          set -e
          BASE=$HOME/android-sdk
          mkdir -p "$BASE/cmdline-tools"
          for i in 1 2 3; do
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -O /tmp/tools.zip && break
            echo "下载重试 $i"; sleep 10
          done
          unzip -q /tmp/tools.zip -d "$BASE/cmdline-tools"
          mv "$BASE/cmdline-tools/cmdline-tools" "$BASE/cmdline-tools/latest"
          echo "ANDROID_HOME=$BASE" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$BASE" >> "$GITHUB_ENV"
          yes | "$BASE/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 构建 APK (debug 签名, 可直接安装)
        run: gradle -p android-apk assembleDebug --no-daemon

      - name: 整理产物
        run: |
          cp android-apk/app/build/outputs/apk/debug/app-debug.apk \
             "研华IO卡检测控制台_v2.3.3_debug.apk"
          ls -lh "研华IO卡检测控制台_v2.3.3_debug.apk"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: io-console-apk
          path: 研华IO卡检测控制台_v2.3.3_debug.apk
          retention-days: 90
