plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.aic.ioconsole'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aic.ioconsole'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        // 桥接服务跑在手机本地: SSH(paramiko) 直连目标主机, 无需中间服务器
        pip {
            install 'paramiko'
        }
    }
}
