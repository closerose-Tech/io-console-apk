plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.aic.ioconsole'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aic.ioconsole'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '2.4.0'

        // Chaquopy 必需: 指定包含 Python 运行库的 ABI
        // 仅保留 arm64: 32 位不支持 16KB 页对齐, 且 2025 年后机型均为 64 位
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        // Python 3.13: 16KB 内存页设备(Android 15+ 新机型)必需,
        // 3.12 及以下的旧 wheel 未做 16KB 对齐会导致 dlopen 闪退
        version = '3.13'
        // 桥接服务跑在手机本地: SSH(paramiko) 直连目标主机, 无需中间服务器
        pip {
            install 'paramiko'
        }
    }
}
